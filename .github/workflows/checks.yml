name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test artwork service
        run: |
          python3 -m venv /tmp/artwork-tests
          /tmp/artwork-tests/bin/pip install -r server/artwork/requirements.txt
          cd server/artwork
          /tmp/artwork-tests/bin/python -m unittest -q
  check:
    name: macOS / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release scripts
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/release.py packaging/dmg-settings.py
          python3 -m unittest discover -s Tests/ReleaseTests
      - name: Run core tests
        run: ./scripts/swift.sh test
      - name: Build app bundle
        run: ./scripts/build.sh debug
